name: brewverse_cafe_manager
description: Cloud-connected cafe inventory and billing starter app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_thermal_printer: ^2.3.0
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: 3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/dashboard-coffee.png
