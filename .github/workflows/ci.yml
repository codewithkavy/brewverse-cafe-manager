name: BrewVerse checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install Flutter packages
        run: flutter pub get

      - name: Check Dart formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: node .github/scripts/check-dart-format.cjs

      - name: Analyze Flutter app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --dart-define=BREWVERSE_TENANT_MODE=true --dart-define=BREWVERSE_USE_FIREBASE_EMULATORS=true --dart-define=BREWVERSE_FIREBASE_EMULATOR_HOST=127.0.0.1

      - name: Report runner disk usage
        if: always()
        run: df -h

      - name: Save Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brewverse-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # Keep Android/Gradle output off the Firebase runner. The combined job ran
  # out of disk while installing Node dependencies/downloading emulator JARs.
  firebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            security-tests/package-lock.json

      - name: Install Node test dependencies
        run: |
          df -h
          npm ci --prefix functions
          npm ci --prefix security-tests

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.34.0

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ runner.arch }}-15.34.0

      - name: Run Firestore authorization tests
        working-directory: security-tests
        run: firebase emulators:exec --debug --config firebase.json --project brewverse-security-tests --only firestore "npm test"

      - name: Run Storage authorization tests
        working-directory: security-tests
        run: firebase emulators:exec --debug --config firebase.emulators.json --project brewverse-security-tests --only firestore,storage "npm run test:storage"

      - name: Run trusted backend service tests
        working-directory: functions
        run: firebase emulators:exec --debug --config ../security-tests/firebase.emulators.json --project brewverse-security-tests --only firestore "npm test"

      - name: Run callable integration tests
        working-directory: functions
        run: firebase emulators:exec --debug --config ../security-tests/firebase.emulators.json --project brewverse-security-tests --only auth,firestore,functions "npm run test:callables"

      - name: Save Firebase startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-debug-logs
          path: |
            **/firebase-debug.log
            **/firestore-debug.log
            **/storage-debug.log
          if-no-files-found: warn
          retention-days: 3
